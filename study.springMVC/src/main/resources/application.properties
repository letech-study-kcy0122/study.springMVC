sample.value=application\uac12
server.port=8080
server.servlet.context-path=/

#servlet-context.xml
#spring.mvc.view.prefix=/WEB-INF/views
#spring.mvc.view.suffix=.jsp

logging.level.org.springframework.web.servlet.view=DEBUG
logging.level.org.springframework.web.servlet.view.InternalResourceViewResolver=DEBUG
logging.level.org.thymeleaf=DEBUG
logging.level.kr.letech=DEBUG


# UTF-8 \uc778\ucf54\ub529 \uc124\uc815
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# spring \ud504\ub85c\ud30c\uc77c \uc124\uc815(local, dev, prod)
spring.profiles.active=local

# 0917_\ucca8\ubd80\ud30c\uc77c \uae30\ub2a5\uc744 \uc704\ud55c Multipart \uc124\uc815 \ub4f1\ub85d
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=100MB

# SecurityFilter\ub294 SecurityConfig\ub85c \uc885\uacb0
# *-context.xml\uc744 \ubd88\ub7ec\uc624\ub294 \uac74 Bean\ub4f1\ub85d\uc73c\ub85c \ud574\uacb0
# dispatcherServlet\uc774\ub098 Listener\ub294 Boot\uc5d0\uac8c \uc77c\uc784



# DataSource datasource\ub9cc \uc798 \ub9cc\ub4e4\uc5b4\ub123\uc73c\uba74 SqlSession Factory & Template\uc744 \uc54c\uc544\uc11c Boot\uac00 \ub9cc\ub4e0\ub2e4.
spring.datasource.driverClassName=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:23306/mydb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=letech
spring.datasource.password=letech

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mybatis/**/*.xml
#mybatis.config-location=classpath:/config/mybatis/sql-mapper-config.xml

# MessageSource
spring.messages.basename=message/message-common
spring.messages.cache-duration=60s
spring.message.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Thymeleaf
# \uac1c\ubc1c \uc911 \uc790\ub3d9 \ub9ac\ub85c\ub4dc \uc9c0\uc6d0
spring.thymeleaf.cache=false
# templates \ub514\ub809\ud1a0\ub9ac\uc5d0 \ud30c\uc77c\uc774 \uc5c6\uc73c\uba74 \uc5d0\ub7ec\ubc1c\uc0dd
spring.thymeleaf.check-template-location=true
# \ub0b4\ubd80 \uc804\uccb4\ub97c \uc7ac\uadc0\uc801 \ud0d0\uc0c9. *(astrix) \ud544\uc694 \uc5c6\uc74c
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# JSP\uc640 \ubdf0\ub9ac\uc878\ubc84 \uac04\uc758 \ucda9\ub3cc \ubc29\uc9c0\uc6a9
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
#spring.thymeleaf.view-names=pages/*


