<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div th:fragment="header">
      <!--  Header Start -->
	<div v-cloak id="app">
        <nav class="navbar navbar-expand-lg navbar-light">
          <ul class="navbar-nav">
            <li class="nav-item d-block d-xl-none">
              <a class="nav-link sidebartoggler " id="headerCollapse" href="javascript:void(0)">
                <i class="ti ti-menu-2"></i>
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link " href="javascript:void(0)" id="drop1" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="ti ti-bell"></i>
                <div class="notification bg-primary rounded-circle"></div>
              </a>
              <div class="dropdown-menu dropdown-menu-animate-up" aria-labelledby="drop1">
                <div class="message-body">
                  <a href="javascript:void(0)" class="dropdown-item">
                    Item 1
                  </a>
                  <a href="javascript:void(0)" class="dropdown-item">
                    Item 2
                  </a>
                </div>
              </div>
            </li>
          </ul>
          <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
            <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
               
              <li class="nav-item dropdown">
                <a class="nav-link " href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  <img src="/images/profile/user-1.jpg" alt="" width="35" height="35" class="rounded-circle">
                </a>
                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                  <div class="message-body">
					<a sec:authorize="isAuthenticated()" th:href="@{/cmmn/user/detail(userId=${username})}" class="d-flex align-items-center gap-2 dropdown-item">
						<i class="ti ti-user fs-6"></i>
						<p class="mb-0 fs-3">My Account</p>
					</a>
					<a sec:authorize="isAuthenticated()" href="/cmmn/user/list" class="d-flex align-items-center gap-2 dropdown-item">
						<i class="ti ti-mail fs-6"></i>
						<p class="mb-0 fs-3">User Profile</p>
					</a>
					<a sec:authorize="isAuthenticated()" href="javascript:void(0)" class="d-flex align-items-center gap-2 dropdown-item">
						<i class="ti ti-list-check fs-6"></i>
						<p class="mb-0 fs-3">My Task</p>
					</a>
					<a sec:authorize="isAuthenticated()" href="/cmmn/sec/logout" class="btn btn-outline-danger mx-3 mt-2 d-block">
						Logout
					</a>
					<span sec:authorize="!isAuthenticated()" class="btn btn-outline-secondary mx-3 mt-2 d-block" onclick="openLoginPopup()">
						LogIn
					</span>
					<span sec:authorize="!isAuthenticated()" class="btn btn-outline-primary mx-3 mt-2 d-block" onclick="openSignUpPage()">
						SignUp
					</span>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </nav>
	</div>
      <!--  Header End -->

	<script th:inline="javascript">
		//layout 처리를 할 때 createApp이 여기저기 선언되어서 중복될 수는 없는 것 같다.
		// 0924_로그인페이지 팝업처리
		function openLoginPopup() {
			  window.open("/cmmn/sec/loginForm", "loginPopup", "width=600px,height=410px,scrollbars=yes");
		}
		
		function openSignUpPage() {
			location.href = "/cmmn/user/insert";
		}
	</script>
</div>
</html>
