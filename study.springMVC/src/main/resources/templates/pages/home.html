<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<div layout:fragment="content">
<div id="app">
	<h1>Hello!! Korea</h1>
	<h2>
		The time on the Today is <span id="clock"></span>
	</h2>
</div>

    <script th:inline="javascript">
	const { createApp, ref, onMounted } = Vue;
	
	createApp({
		setup() {
			const display = ref(null);
			const serverTime = ref(/*[[${serverTime}]]*/'');
			let currentTime = new Date(serverTime.value);
			
			const fn_updateClock = () => {
				if(display.value){
					display.value.innerHTML = currentTime.toLocaleString();
					currentTime.setSeconds(currentTime.getSeconds() + 1);
				}
			};
			
			onMounted(() => {
				display.value = document.getElementById("clock");
				fn_updateClock();
				setInterval(fn_updateClock, 1000);
			});
		}
	}).mount("#app");

    </script>
</div>
</html>
